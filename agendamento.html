<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WB Airsoft - Agendamento de Serviço</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .agenda-container { max-width: 500px; width: 100%; }
        .agenda-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .agenda-card h2 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e94560, #533483);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 28px;
        }
        .agenda-card p { text-align: center; color: #888; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-weight: 500; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #eee;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #e94560, #533483);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(233, 69, 96, 0.5); }
        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .loading { display: none; text-align: center; margin-top: 20px; color: #e94560; }
        .info-box {
            background: rgba(233, 69, 96, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
    </style>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="agenda-container">
        <div class="agenda-card">
            <h2>🔫 WB Airsoft</h2>
            <p>Agende o envio do seu equipamento</p>
            
            <div class="info-box">
                📍 Retirada e devolução na loja<br>
                ⏰ Horário comercial: 09h às 18h
            </div>
            
            <form id="form-agendamento">
                <div class="form-group">
                    <label>📝 Nome completo *</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label>📞 Telefone (WhatsApp) *</label>
                    <input type="tel" id="telefone" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label>🔫 Equipamento *</label>
                    <input type="text" id="equipamento" required placeholder="Ex: Pistola Glock 17, Fuzil M4">
                </div>
                <div class="form-group">
                    <label>📅 Data para entrega *</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>⏰ Horário para entrega *</label>
                    <select id="horario" required>
                        <option value="">Selecione um horário</option>
                        <option value="09:00">09:00 - 10:00</option>
                        <option value="10:00">10:00 - 11:00</option>
                        <option value="11:00">11:00 - 12:00</option>
                        <option value="13:00">13:00 - 14:00</option>
                        <option value="14:00">14:00 - 15:00</option>
                        <option value="15:00">15:00 - 16:00</option>
                        <option value="16:00">16:00 - 17:00</option>
                        <option value="17:00">17:00 - 18:00</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📝 Observações (opcional)</label>
                    <textarea id="obs" rows="3" placeholder="Descreva o problema ou serviço desejado..."></textarea>
                </div>
                <button type="submit">📨 Enviar Solicitação</button>
            </form>
            
            <div id="loading" class="loading">⏳ Enviando solicitação...</div>
            <div id="success-msg" class="success">✅ Solicitação enviada com sucesso! Entraremos em contato em breve.</div>
            <div id="error-msg" class="error">❌ Erro ao enviar. Tente novamente.</div>
        </div>
    </div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = 'https://cmdbhxnlhwwfssodtxpl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ejR2-145S05asosBAk5M0g_8Kvcz9Z4';
        
        // Criar cliente Supabase (usando nome diferente para evitar conflito)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Definir data mínima (amanhã)
        const hoje = new Date();
        const amanha = new Date(hoje);
        amanha.setDate(hoje.getDate() + 1);
        document.getElementById('data').min = amanha.toISOString().split('T')[0];
        
        // Enviar agendamento
        document.getElementById('form-agendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
            
            const dados = {
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                equipamento: document.getElementById('equipamento').value,
                data: document.getElementById('data').value,
                horario: document.getElementById('horario').value,
                obs: document.getElementById('obs').value || '',
                status: 'pendente'
            };
            
            try {
                const { data, error } = await supabaseClient
                    .from('agendamentos')
                    .insert([dados]);
                
                if (error) throw error;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('form-agendamento').reset();
                
                setTimeout(() => {
                    document.getElementById('success-msg').style.display = 'none';
                }, 5000);
                
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').innerHTML = '❌ Erro: ' + error.message;
                setTimeout(() => {
                    document.getElementById('error-msg').style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
